<app-sidenav></app-sidenav>
<div class="content">
    <div fxLayout="row wrap" fxLayoutGap="">
      <div
        fxFlex="25%"
        fxFlex.xs="100%"
        fxFlex.sm="33%"
        *ngFor="let comps of compsData"
      >
        <mat-card class="mat-elevation-z4">
         
          <div class="arrow-container">
            <mat-icon class="arrow-icon">arrow_forward</mat-icon>
          </div>
          <img
            class="img-card"
            mat-card-image
            src={{comps.image}}
          />
          <mat-card-title class="card-title">{{comps.name}}</mat-card-title>
          <mat-card-content>
            <p>Niveau : {{comps.titreNiveau}}</p>
          </mat-card-content>
          <mat-card-actions>
            <button (click)="routeToComp(comps.id)" mat-button>En savoir plus</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
  <app-dashboard></app-dashboard>
