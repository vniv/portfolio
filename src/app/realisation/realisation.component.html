<app-sidenav></app-sidenav>
<div *ngIf="real" class="presentation-container">
  <mat-card class="presentation-card">
    <h1 class="title">{{real.name}}</h1>
    <h2 class="section-title">Prélude</h2>
    <p class="contenu" [innerHTML]="real.prelude">
    </p>
  </mat-card>

  <mat-card class="presentation-card">
    <h2 class="section-title">Définition et objectifs</h2>
    <div class="valeurs">
      
      <p class="contenu" [innerHTML]="real.objectif"><span>&#160;&#160;&#160;&#160;&#160;&#160;&#160;</span></p>
    </div>
  </mat-card>

  <mat-card class="presentation-card">
    <h2 class="section-title">Etape de réalisation</h2>
    <div class="qualites">
      <p class="contenu"[innerHTML]="real.etape"><span>&#160;&#160;&#160;&#160;&#160;&#160;&#160;</span></p>
    </div>
  </mat-card>

  <mat-card class="presentation-card">
    <h2 class="section-title">Résultats du projet </h2>
    <div class="qualites">
      <p class="contenu" [innerHTML]="real.resultat"><span>&#160;&#160;&#160;&#160;&#160;&#160;&#160;</span></p>
    </div>
  </mat-card>

  <mat-card class="presentation-card">
    <h2 class="section-title">Le lendemain du projet</h2>
    <div class="qualites">
      <p class="contenu" [innerHTML]="real.lendemain"><span>&#160;&#160;&#160;&#160;&#160;&#160;&#160;</span></p>
    </div>
  </mat-card>

  <mat-card class="presentation-card">
    <h2 class="section-title">Compétences associées</h2>
    <div class="comps">
      <button *ngFor="let comp of real.comps"
              (click)="routeToComp(comp.id)"
              mat-raised-button
              class="btn-comp">
              {{comp.nameComp}}
      </button>
    </div>
    
  </mat-card>
</div>
<app-dashboard></app-dashboard>
